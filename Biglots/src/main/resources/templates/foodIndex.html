<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food booking page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
            color: #333;
            transition: border-color 0.3s;
        }

        select:focus,
        input[type="number"]:focus {
            border-color: #007bff;
            outline: none;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Configure Food Service</h1>
        
       
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6" th:action="@{/foodBookingPage}" th:object="${food}" method="post">
          
          <input type="hidden" name="hotelId" th:value="${hotel.hotelId}" />
          

           
        <div>
        
        
                    <label for="roomType" class="block text-gray-700 text-sm font-bold mb-2">Type of food:</label>
                    <select id="typeOfFood" name="typeOfFood" th:field="*{typeOfFood}" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        <option value="">-- Select a meal type --</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option> 
                    <option value="DayPack">DayPack</option>                       
                    </select>
                </div>
                
            
        
    

            <div class="form-group">
               
                <div>
                    <label for="noOfDaysToServeFood" class="block text-gray-700 text-sm font-bold mb-2">Number of Days to Serve Food:</label>
                    <input type="number" id="noOfDaysToServeFood" name="noOfDaysToServeFood" th:field="*{noOfDaysToServeFood}" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" min="0" max="5" required>
                </div>
                
            </div>
                  
                  
                  
                  
            <div class="button-container">
                <button type="submit">Submit Configuration</button>
            </div>
        </form>
        <div class="footer-note">
            This form can be integrated with a Spring Boot backend.
        </div>
    </div>
</body>
</html>
