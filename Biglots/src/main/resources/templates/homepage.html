<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

<style>
    body {
      margin: 0;
    }

    .navbar {
      background-color: #007bff; /* Blue background color */
      overflow: hidden;
    }

    .navbar a {
      float:right ;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    .navbar input[type=text] {
      float: right;
      padding: 6px;
      margin-top: 8px;
      margin-left: 16px;
      border: none;
      font-size: 17px;
    }

    .navbar .search-container {
      float: left;
    }

    .navbar .search-container button {
      float: left;
      padding: 6px 10px;
      margin-top: 8px;
      margin-right: 16px;
      background: #ddd;
      font-size: 17px;
      border: none;
      cursor: pointer;
    }

    .navbar a:hover {
      background-color: #0056b3; /* Darker blue on hover */
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">Features</a>
    <a href="#">Pricing</a>
    <a href="#">About</a>
    <div class="search-container">
      <input type="text" placeholder="Search..." name="search">
      <button type="submit">Search</button>
    </div>
  </div>

</body>


</body>
</html>
