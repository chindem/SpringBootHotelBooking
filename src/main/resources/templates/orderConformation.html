<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 40px 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .checkmark {
      font-size: 60px;
      color: #2ecc71;
      margin-bottom: 20px;
      line-height: 1;
    }

    h1 {
      color: #2ecc71;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background-color: #2ecc71;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #27ae60;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 24px;
      }

      .checkmark {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="checkmark">✔️</div>

    <h1>Order Confirmed!</h1>
    <p>Your order has been successfully placed. A confirmation email is on its way.</p>
    
    <form th:action="@{/sendEmail}" method="post">
    <input type="hidden" name="hotelId" th:value="${hotel.hotelId}" />
    <input type="hidden" name="foodId" th:value="${food.foodId}" />
    
    <label for="email">Enter your email:</label><br>
    <input type="email" id="email" name="email" required/><br><br>
    <button type="submit">Send Email</button>
</form>


    <a href="/" class="btn">Back to Home</a>
  </div>

</body>
</html>
